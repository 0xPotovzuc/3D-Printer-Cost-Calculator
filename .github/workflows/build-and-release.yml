# Bu GitHub Actions iş akışının adı
name: Build Portable App with Briefcase

# İş akışının ne zaman tetikleneceğini belirler
on:
  # 1. 'main' branch'ine her kod gönderildiğinde (push) çalışır
  push:
    branches:
      - "main"
  # 2. GitHub Actions sayfasından manuel olarak çalıştırma imkanı sunar
  workflow_dispatch:

jobs:
  build_and_release:
    # İşin çalışacağı sanal makineyi belirtir. Windows için 'windows-latest' kullanılır.
    runs-on: windows-latest

    # İş akışına sürüm oluşturma izni verir
    permissions:
      contents: write

    # Python'u UTF-8 karakter setini kullanmaya zorlar
    env:
      PYTHONUTF8: "1"

    steps:
    # 1. Adım: Depodaki kodları sanal makineye indirir
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Adım: Belirtilen sürümde Python'u kurar
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3. Adım: Gerekli kütüphaneleri requirements.txt dosyasından yükler
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Adım: Briefcase ile uygulamayı oluşturur, derler ve paketler
    - name: Build and package with Briefcase
      run: |
        # Briefcase'in Windows için gerekli şablonları indirmesini sağlar
        briefcase create windows
        # Uygulamayı derler
        briefcase build windows
        # Uygulamayı bir ZIP dosyası olarak paketler
        briefcase package windows --packaging-format zip

    # 5. Adım: Otomatik olarak bir GitHub Sürümü (Release) oluşturur ve .zip dosyasını yükler
    - name: Create or Update Release
      uses: softprops/action-gh-release@v2
      with:
        # Briefcase, paketlenmiş dosyayı bu konuma koyar
        files: windows/"Maliyet Hesaplayıcı"-3.0.zip
        tag_name: "latest-build"
        prerelease: true
        generate_release_notes: true
