# Bu GitHub Actions iş akışının adı
name: Build Portable EXE with PyOxidizer

# İş akışının ne zaman tetikleneceğini belirler
on:
  # 1. 'main' branch'ine her kod gönderildiğinde (push) çalışır
  push:
    branches:
      - "main"
  # 2. GitHub Actions sayfasından manuel olarak çalıştırma imkanı sunar
  workflow_dispatch:

jobs:
  build_and_release:
    # İşin çalışacağı sanal makineyi belirtir. Windows için 'windows-latest' kullanılır.
    runs-on: windows-latest

    # İş akışına sürüm oluşturma izni verir
    permissions:
      contents: write

    # PyOxidizer sürümünü bir ortam değişkeni olarak tanımlıyoruz
    env:
      PYOXIDIZER_VERSION: "0.26.0"

    steps:
    # 1. Adım: Depodaki kodları sanal makineye indirir
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Adım: Belirtilen sürümde Python'u kurar
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3. Adım: Projenin kütüphanelerini yükler
    - name: Install project dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Adım: PyOxidizer'ı indirir ve kurar
    - name: Install PyOxidizer
      shell: pwsh
      run: |
        $url = "https://github.com/indygreg/PyOxidizer/releases/download/pyoxidizer%2F${env:PYOXIDIZER_VERSION}/pyoxidizer-${env:PYOXIDIZER_VERSION}-x86_64-pc-windows-msvc.tar.gz"
        # DEĞİŞTİRİLDİ: Daha güvenilir bir indirme aracı olan curl kullanıldı.
        curl.exe -L $url -o pyoxidizer.tar.gz
        tar -xzf pyoxidizer.tar.gz
        echo "$PWD/pyoxidizer-${env:PYOXIDIZER_VERSION}-x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # 5. Adım: PyOxidizer ile .exe dosyasını derler
    - name: Build executable with PyOxidizer
      run: pyoxidizer build

    # 6. Adım: Otomatik olarak bir GitHub Sürümü (Release) oluşturur ve .exe dosyasını yükler
    - name: Create or Update Release
      uses: softprops/action-gh-release@v2
      with:
        # PyOxidizer, derlenmiş dosyayı bu klasöre koyar
        files: build/x86_64-pc-windows-msvc/debug/install/Maliyet_Hesaplayici.exe
        tag_name: "latest-build"
        prerelease: true
        generate_release_notes: true
