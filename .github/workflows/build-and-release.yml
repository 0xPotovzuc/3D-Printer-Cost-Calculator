# Bu GitHub Actions iş akışının adı
name: Build Portable App with cx_Freeze

# İş akışının ne zaman tetikleneceğini belirler
on:
  # 1. 'main' branch'ine her kod gönderildiğinde (push) çalışır
  push:
    branches:
      - "main"
  # 2. GitHub Actions sayfasından manuel olarak çalıştırma imkanı sunar
  workflow_dispatch:

jobs:
  build_and_release:
    # İşin çalışacağı sanal makineyi belirtir. Windows için 'windows-latest' kullanılır.
    runs-on: windows-latest

    # İş akışına sürüm oluşturma izni verir
    permissions:
      contents: write

    # Python'u UTF-8 karakter setini kullanmaya zorlar
    env:
      PYTHONUTF8: "1"

    steps:
    # 1. Adım: Depodaki kodları sanal makineye indirir
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Adım: Belirtilen sürümde Python'u kurar
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3. Adım: Gerekli kütüphaneleri requirements.txt dosyasından yükler
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Adım: cx_Freeze ile uygulamayı derler
    - name: Build application with cx_Freeze
      run: python setup.py build

    # YENİ EKLENDİ - 5. Adım: UYARI.txt dosyasını oluşturur
    - name: Create README file for users
      shell: pwsh
      run: |
        $buildFolder = Get-ChildItem -Path build -Directory | Where-Object { $_.Name -like 'exe.*' } | Select-Object -First 1
        $readmeContent = @"
        --- ÖNEMLİ BİLGİLENDİRME ---

        Merhaba! Bu uygulama taşınabilir (portable) olarak paketlenmiştir ve kurulum gerektirmez.

        1. UYGULAMANIN ÇALIŞMASI:
           'Maliyet Hesaplayıcı.exe' dosyasının düzgün çalışabilmesi için bu klasördeki diğer dosyaları ve klasörleri SİLMEYİN veya YERİNİ DEĞİŞTİRMEYİN.

        2. KISAYOL OLUŞTURMA:
           Uygulamaya kolayca erişmek için 'Maliyet Hesaplayıcı.exe' dosyasına sağ tıklayıp "Kısayol Oluştur" seçeneğini kullanabilirsiniz. Oluşturduğunuz bu kısayolu Masaüstü'ne veya istediğiniz başka bir yere taşıyabilirsiniz.

        3. EXCEL DOSYASI:
           Satışlarınızı kaydettiğiniz 'satislar.xlsx' dosyası da bu klasörün içinde oluşacaktır. Bu dosyaya da kolayca erişmek için bir kısayol oluşturmanızı tavsiye ederiz.

        Bu klasörü istediğiniz yere (örneğin Belgelerim veya Masaüstü) taşıyabilirsiniz.
        "@
        Set-Content -Path "$($buildFolder.FullName)/UYARI.txt" -Value $readmeContent -Encoding utf8

    # 6. Adım: Oluşturulan derleme klasörünü bir .zip arşivine sıkıştırır
    - name: Zip the build folder
      shell: pwsh
      run: |
        $buildFolder = Get-ChildItem -Path build -Directory | Where-Object { $_.Name -like 'exe.*' } | Select-Object -First 1
        Compress-Archive -Path "$($buildFolder.FullName)/*" -DestinationPath "Maliyet-Hesaplayici-Windows.zip"

    # 7. Adım: Otomatik olarak bir GitHub Sürümü (Release) oluşturur ve .zip dosyasını yükler
    - name: Create or Update Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "Maliyet-Hesaplayici-Windows.zip"
        tag: "latest-build"
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        prerelease: true
        generateReleaseNotes: true
