# Bu GitHub Actions iş akışının adı
name: Build and Release EXE with Nuitka

# İş akışının ne zaman tetikleneceğini belirler
on:
  # 1. 'main' branch'ine her kod gönderildiğinde (push) çalışır
  push:
    branches:
      - "main"
  # 2. GitHub Actions sayfasından manuel olarak çalıştırma imkanı sunar
  workflow_dispatch:

jobs:
  build_and_release:
    # İşin çalışacağı sanal makineyi belirtir. Windows için 'windows-latest' kullanılır.
    runs-on: windows-latest

    # İş akışına sürüm oluşturma izni verir
    permissions:
      contents: write

    steps:
    # 1. Adım: Depodaki kodları sanal makineye indirir
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Adım: Belirtilen sürümde Python'u kurar
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11' # Kullandığınız Python sürümünü yazabilirsiniz

    # 3. Adım: Gerekli kütüphaneleri requirements.txt dosyasından yükler
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Adım: Nuitka ile .py dosyasını .exe'ye dönüştürür
    - name: Build executable with Nuitka
      run: |
        python -m nuitka --onefile --windows-disable-console --enable-plugin=tk-inter --output-name="Maliyet Hesaplayıcı" --output-dir=dist MaliyetV3.py

    # 5. Adım: Otomatik olarak bir GitHub Sürümü (Release) oluşturur ve .exe dosyasını yükler
    - name: Create or Update Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/"Maliyet Hesaplayıcı.exe"
        # Her çalıştığında "Latest Build" adında tek bir sürüm oluşturur veya günceller
        tag_name: "latest-build"
        # Bu sürümün bir ön sürüm olduğunu belirtir
        prerelease: true
        # Sürüm notlarını otomatik olarak oluşturur
        generate_release_notes: true
