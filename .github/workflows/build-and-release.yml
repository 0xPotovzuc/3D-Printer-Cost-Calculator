# Bu GitHub Actions iş akışının adı
name: Build and Release EXE with cx_Freeze

# İş akışının ne zaman tetikleneceğini belirler
on:
  # 1. 'main' branch'ine her kod gönderildiğinde (push) çalışır
  push:
    branches:
      - "main"
  # 2. GitHub Actions sayfasından manuel olarak çalıştırma imkanı sunar
  workflow_dispatch:

jobs:
  build_and_release:
    # İşin çalışacağı sanal makineyi belirtir. Windows için 'windows-latest' kullanılır.
    runs-on: windows-latest

    # İş akışına sürüm oluşturma izni verir
    permissions:
      contents: write

    steps:
    # 1. Adım: Depodaki kodları sanal makineye indirir
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Adım: Belirtilen sürümde Python'u kurar
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3. Adım: Gerekli kütüphaneleri requirements.txt dosyasından yükler
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Adım: cx_Freeze ile .py dosyasını .exe'ye dönüştürür
    - name: Build executable with cx_Freeze
      run: python setup.py build

    # 5. Adım: Oluşturulan derleme klasörünü bir .zip arşivine sıkıştırır
    # cx_Freeze, 'build' klasörü içinde bir klasör daha oluşturur. İçeriğini ziplememiz gerekir.
    - name: Zip the executable folder
      shell: pwsh
      run: |
        $buildFolder = Get-ChildItem -Path build -Directory | Where-Object { $_.Name -like 'exe.*' } | Select-Object -First 1
        Compress-Archive -Path "$($buildFolder.FullName)/*" -DestinationPath "Maliyet-Hesaplayici-Windows.zip"

    # 6. Adım: Otomatik olarak bir GitHub Sürümü (Release) oluşturur ve .zip dosyasını yükler
    - name: Create or Update Release
      uses: softprops/action-gh-release@v2
      with:
        files: "Maliyet-Hesaplayici-Windows.zip"
        tag_name: "latest-build"
        prerelease: true
        generate_release_notes: true
